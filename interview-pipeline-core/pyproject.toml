[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-pipeline-core"
version = "0.1.0"
description = "Reusable diarization, transcription, and speaker-merge pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Beauxsoleil" }]
dependencies = []

[project.optional-dependencies]
ml = [
    "whisperx==3.1.1",
    "pyannote.audio==3.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
